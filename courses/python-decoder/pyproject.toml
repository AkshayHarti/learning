[project]
name = "llm-first-principles"
version = "0.1.0"
description = "An 8-week, first-principles, hands-on course on large language models"
requires-python = ">=3.11"

dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests", "weeks"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
